<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Outlook 邮件管理</title>
    <link rel="icon" type="image/png" href="/img/ico.png">
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        body { margin: 0; }
    </style>
</head>
<body>
    <div id="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
                <h1>Outlook 邮件管理</h1>
                <p>安全登录以管理您的邮箱账号</p>
            </div>

            <div id="errorMessage" class="form-error" style="display:none; margin-bottom:1rem; padding:0.7rem 1rem; background:rgba(192,57,43,0.08); border:1px solid rgba(192,57,43,0.2); border-radius:var(--radius-sm);"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="password">登录密码</label>
                    <input type="password" class="form-input" id="password" placeholder="请输入密码" autofocus required>
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%; padding:0.7rem; font-size:0.95rem; display:flex; align-items:center; justify-content:center; gap:0.4rem;">登录</button>
            </form>

            <p style="text-align:center; font-size:0.72rem; color:var(--text-muted); margin-top:1.5rem;">
                Outlook 邮件管理工具 · 安全访问
            </p>
        </div>
    </div>

    <script src="/static/js/i18n.js"></script>
    <script>
        const loginBtn = document.getElementById('loginBtn');

        function setLoginBtnLoading(loading) {
            if (loading) {
                loginBtn.disabled = true;
                loginBtn.classList.add('btn-loading');
                loginBtn.innerHTML =
                    '<span class="spinner"></span><span>' + translateAppText('登录中...') + '</span>';
            } else {
                loginBtn.disabled = false;
                loginBtn.classList.remove('btn-loading');
                loginBtn.textContent = translateAppText('登录');
            }
        }

        function showLoginError(text) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = text;
            errorMessage.style.display = 'block';
        }

        async function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const pickApiMessage = window.pickApiMessage || ((payload, zh) => zh);
            const translateText = window.translateAppText || ((text) => text);

            if (!password) {
                showLoginError(translateText('请输入密码'));
                return;
            }

            setLoginBtnLoading(true);
            document.getElementById('errorMessage').style.display = 'none';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await response.json();

                if (data.success) {
                    // 成功：保持按钮禁用（防止重复提交），直接跳转
                    loginBtn.innerHTML = '<span class="spinner"></span><span>' + translateText('登录中...') + '</span>';
                    window.location.href = '/';
                } else {
                    const msg = (data.error && typeof data.error === 'object')
                        ? pickApiMessage(data.error, '登录失败', 'Login failed')
                        : translateText(data.error || '登录失败');
                    showLoginError(msg);
                    setLoginBtnLoading(false);
                }
            } catch (error) {
                showLoginError(translateText('网络错误，请重试'));
                setLoginBtnLoading(false);
            }
        }

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
